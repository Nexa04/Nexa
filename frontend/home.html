    <script>
function showFilter(type, button) {

    document.querySelectorAll(".filter").forEach(
        function(filter) {
            filter.classList.remove("active");
        }
    );

    button.classList.add("active");

    const chatItems =
        document.querySelectorAll(".home-chat-item");

    chatItems.forEach(
        function(chatItem) {

            const conversationType =
                chatItem.dataset.conversationType;

            const unreadCount =
                Number(
                    chatItem.dataset.unreadCount || 0
                );

            if (type === "all") {

                chatItem.style.display = "flex";

            } else if (type === "unread") {

                if (unreadCount > 0) {
                    chatItem.style.display = "flex";
                } else {
                    chatItem.style.display = "none";
                }

            } else if (type === "groups") {

                if (conversationType === "group") {
                    chatItem.style.display = "flex";
                } else {
                    chatItem.style.display = "none";
                }

            }

        }
    );
}
    </script>
<script>

async function loadHomeChats() {

    const token =
        localStorage.getItem("access_token");

    if (!token) {
        window.location.href = "index.html";
        return;
    }

    const homeChats =
        document.getElementById("homeChats");

    const emptyChats =
        document.getElementById("emptyChats");

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/conversations",
            {
                method: "GET",
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            console.error(
                "Could not load conversations:",
                data
            );

            return;
        }

        const conversations =
            data.conversations || [];

        /*
         * No conversations
         */
        if (conversations.length === 0) {

            emptyChats.style.display = "flex";

            return;
        }

        /*
         * There are conversations
         */
        emptyChats.style.display = "none";

        homeChats.innerHTML = "";

        conversations.forEach(function(conversation) {

            if (
    conversation.conversation_type === "group"
) {

    const chatItem =
        document.createElement("div");

    chatItem.className =
        "home-chat-item";

    chatItem.dataset.conversationType =
        "group";

    chatItem.dataset.unreadCount =
        conversation.unread_count || 0;


    chatItem.innerHTML = `

        <div class="home-chat-avatar">
            👥
        </div>

        <div class="home-chat-info">

            <h3>
                ${
                    conversation.group_name ||
                    "Group"
                }
            </h3>

            <p>
                Group
            </p>

        </div>

    `;


    chatItem.addEventListener(
        "click",
        function() {

            localStorage.setItem(
                "conversationId",
                conversation.conversation_id
            );

            localStorage.setItem(
                "chatUser",
                conversation.group_name ||
                "Group"
            );

            localStorage.setItem(
                "chatType",
                "group"
            );


            window.location.href =
                "chat.html";

        }
    );


    homeChats.appendChild(
        chatItem
    );

    return;
}


if (!conversation.other_user) {
    return;
}

const user =
    conversation.other_user;

            const chatItem =
                document.createElement("div");

            chatItem.className =
                "home-chat-item";
            chatItem.dataset.conversationType =
                conversation.conversation_type || "private";

            chatItem.dataset.unreadCount =
                conversation.unread_count || 0;
            chatItem.dataset.groupName =
                conversation.group_name || "Group";         
            chatItem.innerHTML = 
        `
 <div class="home-chat-avatar">
    ${
        user.profile_picture
        ? `<img src="${
            user.profile_picture.startsWith("http")
            ? user.profile_picture
            : "http://127.0.0.1:8000" + user.profile_picture
        }" alt="Profile">`
        : "👤"
    }
</div>

                <div class="home-chat-info">

                    <h3>
                        ${user.full_name || "User"}
                    </h3>

                    <p>
                        Tap to open conversation
                    </p>

                </div>

            `;

            chatItem.addEventListener(
                "click",
                async function() {

                    try {

                        const response =
                            await fetch(
                                "http://127.0.0.1:8000/conversations",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json",
                                        "Authorization":
                                            "Bearer " + token
                                    },
                                    body: JSON.stringify({
                                        user_id:
                                            user.user_id
                                    })
                                }
                            );

                        const data =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                data.detail ||
                                "Could not open chat."
                            );

                            return;
                        }

                        localStorage.setItem(
                            "chatUser",
                            user.full_name || "User"
                        );

                        localStorage.setItem(
                            "chatUserId",
                            user.user_id
                        );

                        localStorage.setItem(
                            "conversationId",
                            data.conversation_id
                        );
                        localStorage.setItem(
                            "chatType",
                            "private"
                        );

                        window.location.href =
                            "chat.html";

                    } catch (error) {

                        console.error(
                            "Open chat error:",
                            error
                        );

                        alert(
                            "Cannot connect to Nexa server."
                        );
                    }

                }
            );

            homeChats.appendChild(
                chatItem
            );

        });

    } catch (error) {

        console.error(
            "Load home chats error:",
            error
        );
    }
}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadHomeChats();

    }
);

</script>
<script>

async function loadNotificationCount() {

    const token =
        localStorage.getItem("access_token");

    if (!token) {
        return;
    }

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/notifications",
            {
                method: "GET",
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        if (!response.ok) {
            return;
        }

        const notifications =
            data.notifications || [];

        const unreadCount =
            notifications.filter(
                function(notification) {
                    return !notification.is_read;
                }
            ).length;

        const countElement =
            document.getElementById(
                "notificationCount"
            );

        if (countElement) {

            countElement.textContent =
                unreadCount;

        }

    } catch (error) {

        console.error(
            "Load notification count error:",
            error
        );

    }
}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadNotificationCount();

    }
);
// =========================
// INCOMING CALL CHECK
// =========================

let incomingCallShown = false;

async function checkIncomingCall() {

    const token = localStorage.getItem("access_token");

    if (!token || incomingCallShown) {
        return;
    }

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/calls/incoming",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            return;
        }

        if (data.calls && data.calls.length > 0) {

            const call = data.calls[0];

            incomingCallShown = true;

            localStorage.setItem(
                "incomingCallId",
                call.call_id
            );

            localStorage.setItem(
                "incomingCallerId",
                call.caller_id
            );

            localStorage.setItem(
                "incomingCallerName",
                call.caller_name
            );

            showIncomingCallPopup(call);
        }

    } catch (error) {

        console.error(
            "Incoming call check error:",
            error
        );
    }
}
function showIncomingCallPopup(call) {

    const popup = document.createElement("div");

    popup.id = "incomingCallPopup";

    popup.innerHTML = `
        <div class="incoming-popup-content">

            <div class="incoming-call-icon">
                📞
            </div>

            <h2>Incoming Audio Call</h2>

            <p>${call.caller_name || "User"}</p>

            <div class="incoming-popup-buttons">

                <button onclick="declineIncomingCall()">
                    Decline
                </button>

                <button onclick="acceptIncomingCall()">
                    Accept
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(popup);
}
async function acceptIncomingCall() {

    const callId =
        localStorage.getItem("incomingCallId");

    if (!callId) {
        return;
    }

    window.location.href =
        "audio-call.html";
}
async function declineIncomingCall() {

    const callId =
        localStorage.getItem("incomingCallId");

    if (!callId) {
        return;
    }

    try {

        await fetch(
            "http://127.0.0.1:8000/calls/" +
            callId +
            "/end",
            {
                method: "PUT",
                headers: {
                    "Authorization":
                        "Bearer " +
                        localStorage.getItem("access_token")
                }
            }
        );

    } catch (error) {

        console.error(error);
    }

    const popup =
        document.getElementById(
            "incomingCallPopup"
        );

    if (popup) {
        popup.remove();
    }

    incomingCallShown = false;

    localStorage.removeItem("incomingCallId");
}
setInterval(
    checkIncomingCall,
    1000
);

checkIncomingCall();
</script>

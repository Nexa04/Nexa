<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Support - Nexa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="support-container">

        <!-- Header -->
        <header class="support-header">

            <button
                class="support-back"
                onclick="window.location.href='help.html'">
                ←
            </button>

            <h1>Contact Support</h1>

        </header>


        <!-- Intro -->
        <main class="support-content">

            <div class="support-intro">

                <h2>How can we help?</h2>

                <p>
                    Our support team is here to help you with
                    any questions or concerns.
                </p>

            </div>

<!-- Support Options -->

<button class="support-option" onclick="openSupportBox('Chat with Support')">

    <div class="support-option-text">
        <strong>Chat with Support</strong>
        <small>Talk directly with the Nexa support team</small>
    </div>

    <span>›</span>

</button>


<button class="support-option" onclick="openSupportBox('Safety Assistance')">

    <div class="support-option-text">
        <strong>Safety Assistance</strong>
        <small>Get help with a safety-related concern</small>
    </div>

    <span>›</span>

</button>


<button class="support-option" onclick="openSupportBox('Technical Help')">

    <div class="support-option-text">
        <strong>Technical Help</strong>
        <small>Get help with technical problems</small>
    </div>

    <span>›</span>

</button>


<button class="support-option" onclick="openSupportBox('Account Help')">

    <div class="support-option-text">
        <strong>Account Help</strong>
        <small>Get help with your Nexa account</small>
    </div>

    <span>›</span>

</button>


<!-- Problem Box -->

<div class="support-message-box" id="supportMessageBox">

    <h3 id="supportTitle">Tell us about your problem</h3>

    <textarea
        id="supportMessage"
        placeholder="Describe your problem..."></textarea>

    <button class="send-support" onclick="sendSupportMessage()">
        Send
    </button>

</div>

<!-- My Support Requests -->

<div class="my-support-section">

    <h3>My Support Requests</h3>

    <button
        class="support-option"
        onclick="loadMySupportRequests()">

        <div class="support-option-text">
            <strong>View My Requests</strong>
            <small>Check your previous support requests</small>
        </div>

        <span>›</span>

    </button>

    <div id="mySupportRequests"></div>

</div>


            <!-- Bottom Message -->

            <div class="support-footer">

                <strong>We're here to help.</strong>

                <p>
                    Your message will be sent directly
                    to the Nexa support team.
                </p>

            </div>




        </main>

    </div>
    <script>


// =========================
// Support Type
// =========================

let selectedSupportType = null;

function openSupportBox(type) {

    const box = document.getElementById("supportMessageBox");

    const title = document.getElementById("supportTitle");

    title.textContent = type;

    selectedSupportType = type;

    box.style.display = "block";

    box.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}


// =========================
// Send Support Message
// =========================

async function sendSupportMessage() {

    const message =
        document.getElementById("supportMessage").value.trim();

    if (!selectedSupportType) {
        alert("Please select a support category.");
        return;
    }

    if (message === "") {
        alert("Please describe your problem.");
        return;
    }

    const token = localStorage.getItem("access_token");

    if (!token) {
        alert("Please login first.");
        window.location.href = "login.html";
        return;
    }

    // Convert support type
    const typeMapping = {
        "Chat with Support": "general_support",
        "Safety Assistance": "safety_assistance",
        "Technical Help": "technical_help",
        "Account Help": "account_help"
    };

    const requestType = typeMapping[selectedSupportType];

    const sendButton =
        document.querySelector(".send-support");

    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/support",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },

                body: JSON.stringify({
                    request_type: requestType,
                    subject: selectedSupportType,
                    message: message
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Failed to send support request.");
            return;
        }

        alert("Your support request has been sent successfully!");

        document.getElementById("supportMessage").value = "";

        selectedSupportType = null;

        document.getElementById("supportMessageBox").style.display = "none";

    }

    catch (error) {

        console.error("Support Error:", error);

        alert("Cannot connect to Nexa server.");

    }

    finally {

        sendButton.disabled = false;
        sendButton.textContent = "Send";

    }
}


// =========================
// Get My Support Requests
// =========================

async function loadMySupportRequests() {

    const token = localStorage.getItem("access_token");

    if (!token) {
        alert("Please login first.");
        window.location.href = "login.html";
        return;
    }

    const container =
        document.getElementById("mySupportRequests");

    container.textContent = "Loading requests...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/support",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            container.textContent =
                data.detail || "Failed to load requests.";
            return;
        }

        container.replaceChildren();

        if (data.support_requests.length === 0) {
            container.textContent = "You have no support requests yet.";
            return;
        }

        data.support_requests.forEach(request => {

            const card = document.createElement("div");
            card.className = "support-option";

            const details = document.createElement("div");
            details.className = "support-option-text";

            const title = document.createElement("strong");
            title.textContent = request.subject;

            const type = document.createElement("small");
            type.textContent = "Type: " + request.request_type;

            const message = document.createElement("p");
            message.textContent = request.message;

            const status = document.createElement("small");
            status.textContent = "Status: " + request.status;

            const date = document.createElement("small");
            date.textContent = request.created_at
                ? "Date: " + new Date(request.created_at).toLocaleString()
                : "";

            details.append(title, type, message, status, date);
            card.appendChild(details);

            container.appendChild(card);

        });

    }

    catch (error) {

        console.error("Load Support Requests Error:", error);

        container.textContent = "Cannot connect to Nexa server.";

    }
}

</script>

</body>

</html>

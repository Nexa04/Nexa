<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Nexa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-container">

        <!-- =========================
             Header
        ========================== -->

        <header class="profile-header">

            <button
                class="profile-back"
                onclick="window.location.href='settings.html'">
                ←
            </button>

            <h1>Profile</h1>

        </header>


        <!-- =========================
             Profile
        ========================== -->

        <main class="profile-content">

            <!-- Profile Image -->

            <div class="profile-photo">

    <img
        id="profileImage"
        src=""
        alt="Profile Picture"
        style="display: none;">

    <span id="profileCamera">📷</span>

    <button
        class="photo-add"
        onclick="document.getElementById('profileImageInput').click()">
        +
    </button>

    <input
        type="file"
        id="profileImageInput"
        accept="image/*"
        style="display: none;"
        onchange="previewProfileImage(event)">

</div>


            <!-- =========================
                 Profile Fields
            ========================== -->

            <div class="profile-fields">


                <!-- Name -->

                <div class="profile-field">

                    <label>Name</label>

                    <input
                        type="text"
                        id="nameInput"
                        value="Heba Al-Akhras">

                </div>


                <!-- Username -->

                <div class="profile-field">

                    <label>Username</label>

                    <input
                        type="text"
                        id="usernameInput"
                        value="heba.a">

                </div>


                <!-- Phone Number -->

                <div class="profile-field">

                    <label>Phone number</label>

                    <input
                        type="text"
                        id="phoneInput"
                        value="+962 7 9123 4567"
                        readonly>

                </div>


                <!-- Email -->

                <div class="profile-field">

                    <label>Email</label>

                    <input
                        type="email"
                        id="emailInput"
                        value="heba@example.com">

                </div>


                <!-- About -->

                <div class="profile-field">

                    <label>About</label>

                    <input
                        type="text"
                        id="aboutInput"
                        value="Good things take time ✨">

                </div>


            </div>


            <!-- =========================
                 Save Changes
            ========================== -->

            <button
                class="profile-save"
                onclick="saveProfileChanges()">

                Save Changes

            </button>


            <!-- =========================
                 Log Out
            ========================== -->

            <button
                class="profile-logout"
                onclick="logout()">

                Log out

            </button>


        </main>


        <!-- =========================
             Bottom Navigation
        ========================== -->

        <nav class="bottom-nav">

            <button
                class="nav-item"
                onclick="window.location.href='home.html'">

                <span class="nav-icon">▱</span>

                <span>Chats</span>

            </button>


            <button
                class="nav-item"
                onclick="window.location.href='calls.html'">

                <span class="nav-icon">☎</span>

                <span>Calls</span>

            </button>


            <button
                class="nav-item"
                onclick="window.location.href='status.html'">

                <span class="nav-icon">◉</span>

                <span>Status</span>

            </button>


            <button
                class="nav-item active"
                onclick="window.location.href='settings.html'">

                <span class="nav-icon">⚙</span>

                <span>Settings</span>

            </button>

        </nav>

    </div>


    <script src="script.js"></script>
  <script>
    async function loadProfile() {

        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "index.html";
            return;
        }

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/me",
                {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                alert(
                    data.detail ||
                    "Could not load profile."
                );
                return;
            }


            // =========================
            // PROFILE INFORMATION
            // =========================

            document.getElementById("nameInput").value =
                data.full_name || "";

            document.getElementById("usernameInput").value =
                data.username || "";

            document.getElementById("phoneInput").value =
                data.phone || "";

            document.getElementById("emailInput").value =
                data.email || "";

            document.getElementById("aboutInput").value =
                data.about || "";


            // =========================
            // PROFILE PICTURE
            // =========================

            const image =
                document.getElementById("profileImage");

            const camera =
                document.getElementById("profileCamera");


            if (data.profile_picture) {

                let imageUrl =
                    data.profile_picture;

                if (imageUrl.startsWith("/")) {

                    imageUrl =
                        "http://127.0.0.1:8000" +
                        imageUrl;
                }

                image.src = imageUrl;

                image.onload = function () {

                    image.style.display = "block";

                    camera.style.display = "none";
                };


                image.onerror = function () {

                    console.error(
                        "Could not load profile image:",
                        imageUrl
                    );

                    image.style.display = "none";

                    camera.style.display = "block";
                };

            } else {

                image.style.display = "none";

                camera.style.display = "block";
            }

        } catch (error) {

            console.error(
                "Profile error:",
                error
            );
        }
    }


    // Load profile when page opens
    loadProfile();



    // =========================
    // PROFILE PICTURE UPLOAD
    // =========================

    async function previewProfileImage(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        const token =
            localStorage.getItem("access_token");

        if (!token) {

            window.location.href =
                "index.html";

            return;
        }


        // =========================
        // SHOW IMAGE IMMEDIATELY
        // =========================

        const image =
            document.getElementById("profileImage");

        const camera =
            document.getElementById("profileCamera");


        image.src =
            URL.createObjectURL(file);

        image.style.display = "block";

        camera.style.display = "none";


        // =========================
        // UPLOAD IMAGE
        // =========================

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:8000/users/me/profile-picture",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        },

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                alert(
                    data.detail ||
                    "Could not upload profile picture."
                );

                return;
            }


            // Use the URL returned by backend
            if (data.profile_picture) {

                let imageUrl =
                    data.profile_picture;

                if (imageUrl.startsWith("/")) {

                    imageUrl =
                        "http://127.0.0.1:8000" +
                        imageUrl;
                }

                image.src =
                    imageUrl;
            }


            image.style.display = "block";

            camera.style.display = "none";


            alert(
                "Profile picture updated successfully."
            );

        } catch (error) {

            console.error(
                "Profile picture error:",
                error
            );

            alert(
                "Could not connect to the server."
            );
        }
    }
</script>
</body>

</html>
